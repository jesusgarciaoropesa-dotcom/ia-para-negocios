<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Peluquera trabajando con una clienta">
  <!-- pared y suelo -->
  <rect x="0" y="0" width="900" height="690" rx="40" fill="#eef0fb"/>
  <rect x="0" y="660" width="900" height="100" rx="20" fill="#d6d8e4"/>
  <!-- espejo -->
  <path d="M90 520 V230 A150 150 0 0 1 390 230 V520 Z" fill="#cfe2f7" stroke="#17162b" stroke-width="12"/>
  <path d="M150 260 l60 -60 M150 320 l120 -120" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".8"/>
  <!-- tocador -->
  <rect x="50" y="520" width="440" height="34" rx="10" fill="#5b5bd6"/>
  <rect x="80" y="554" width="22" height="110" fill="#3d3cb0"/><rect x="438" y="554" width="22" height="110" fill="#3d3cb0"/>
  <rect x="110" y="470" width="34" height="50" rx="8" fill="#ffd43b"/><rect x="118" y="456" width="18" height="16" rx="4" fill="#17162b"/>
  <rect x="160" y="482" width="28" height="38" rx="8" fill="#f28c8c"/>
  <rect x="204" y="476" width="22" height="44" rx="10" fill="#8f8ff0"/>
  <!-- móvil en el tocador -->
  <g id="telefono">
    <rect x="360" y="420" width="62" height="100" rx="12" fill="#17162b"/>
    <rect x="366" y="430" width="50" height="78" rx="7" fill="#7b7bf0" id="pantalla"/><path id="check" d="M378 470 l10 10 l18 -22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    <g id="ondas" stroke="#e0413a" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M340 440 q-14 30 0 60"/><path d="M322 428 q-24 42 0 84"/>
      <path d="M442 440 q14 30 0 60"/><path d="M460 428 q24 42 0 84"/>
    </g>
  </g>
  <!-- sillón -->
  <ellipse cx="575" cy="676" rx="120" ry="16" fill="#17162b"/>
  <rect x="560" y="570" width="30" height="106" fill="#2c2b45"/>
  <rect x="465" y="540" width="230" height="42" rx="18" fill="#17162b"/>
  <rect x="655" y="370" width="44" height="200" rx="18" fill="#17162b"/>
  <!-- clienta con capa -->
  <path d="M495 560 L520 430 Q575 395 640 430 L660 560 Z" fill="#ffd43b"/>
  <path d="M520 430 Q575 410 640 430" stroke="#e7b91f" stroke-width="10" fill="none"/>
  <rect x="562" y="390" width="32" height="40" fill="#e5b391"/><circle cx="578" cy="352" r="52" fill="#f2c4a2"/>
  <path d="M528 350 Q520 290 578 286 Q640 286 632 352 Q620 318 600 318 Q560 312 540 334 Z" fill="#5b2a6e"/>
  <path d="M548 304 l18 30 M582 296 l8 34 M612 304 l-6 32" stroke="#8a4aa0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="560" cy="362" r="5" fill="#17162b"/><path d="M552 384 q12 8 24 0" stroke="#17162b" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- peluquera -->
  <rect x="740" y="520" width="34" height="150" rx="14" fill="#17162b"/><rect x="786" y="520" width="34" height="150" rx="14" fill="#17162b"/>
  <path d="M722 330 Q780 300 838 330 L850 540 L710 540 Z" fill="#ffffff"/>
  <path d="M732 380 L828 380 L842 540 L718 540 Z" fill="#5b5bd6"/>
  <rect x="756" y="400" width="48" height="30" rx="8" fill="#4848c4"/>
  <circle cx="780" cy="258" r="48" fill="#e9b38f"/>
  <path d="M732 262 Q726 200 782 204 Q836 206 830 262 Q818 228 782 230 Q748 232 732 262 Z" fill="#2b1d14"/>
  <circle cx="810" cy="196" r="24" fill="#2b1d14"/>
  <circle cx="762" cy="262" r="5" fill="#17162b"/><circle cx="792" cy="262" r="5" fill="#17162b"/>
  <path d="M768 284 q10 6 20 0" stroke="#17162b" stroke-width="5" fill="none" stroke-linecap="round" id="boca"/>
  <!-- brazo con el pincel del tinte -->
  <g id="brazo">
    <path d="M736 350 Q690 360 652 330" stroke="#e9b38f" stroke-width="26" fill="none" stroke-linecap="round"/>
    <rect x="610" y="306" width="52" height="14" rx="6" fill="#17162b" transform="rotate(-25 636 313)"/>
    <rect x="600" y="300" width="20" height="22" rx="4" fill="#5b2a6e" transform="rotate(-25 610 311)"/>
  </g>
  <!-- otro brazo con el cuenco -->
  <path d="M826 360 Q850 420 800 450" stroke="#e9b38f" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M760 440 h80 q-6 34 -40 34 q-34 0 -40 -34 Z" fill="#17162b"/><ellipse cx="800" cy="440" rx="40" ry="9" fill="#5b2a6e"/>
</svg>
