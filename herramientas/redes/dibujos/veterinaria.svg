<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Veterinaria atendiendo a un perro en la camilla">
  <!-- pared y suelo -->
  <rect x="0" y="0" width="900" height="690" rx="40" fill="#e6f3ee"/>
  <rect x="0" y="660" width="900" height="100" rx="20" fill="#cfd8d4"/>
  <!-- cartel con huella -->
  <rect x="80" y="80" width="250" height="170" rx="18" fill="#ffffff" stroke="#17162b" stroke-width="10"/>
  <g fill="#2f8a57"><ellipse cx="205" cy="180" rx="38" ry="30"/><circle cx="160" cy="138" r="15"/><circle cx="190" cy="120" r="15"/><circle cx="222" cy="120" r="15"/><circle cx="252" cy="138" r="15"/></g>
  <!-- encimera con el móvil -->
  <rect x="40" y="430" width="250" height="30" rx="10" fill="#5b5bd6"/>
  <rect x="60" y="460" width="210" height="200" fill="#3d3cb0"/>
  <path d="M60 530 h210 M60 600 h210" stroke="#2f2e96" stroke-width="8"/>
  <rect x="70" y="370" width="34" height="60" rx="8" fill="#ffd43b"/><rect x="78" y="356" width="18" height="16" rx="4" fill="#17162b"/>
  <rect x="116" y="392" width="40" height="38" rx="8" fill="#f28c8c"/>
  <g id="telefono">
    <rect x="200" y="330" width="62" height="100" rx="12" fill="#17162b"/>
    <rect x="206" y="340" width="50" height="78" rx="7" fill="#7b7bf0" id="pantalla"/><path id="check" d="M218 380 l10 10 l18 -22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    <g id="ondas" stroke="#e0413a" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M180 350 q-14 30 0 60"/><path d="M162 338 q-24 42 0 84"/>
      <path d="M282 350 q14 30 0 60"/><path d="M300 338 q24 42 0 84"/>
    </g>
  </g>
  <!-- camilla -->
  <rect x="360" y="500" width="320" height="30" rx="12" fill="#b8bcc6"/>
  <rect x="505" y="530" width="30" height="130" fill="#8e98a5"/><ellipse cx="520" cy="668" rx="90" ry="14" fill="#17162b"/>
  <!-- perro -->
  <path d="M600 420 q50 -30 60 -80" stroke="#b5733d" stroke-width="18" fill="none" stroke-linecap="round"/>
  <ellipse cx="530" cy="450" rx="110" ry="52" fill="#c98a4b"/>
  <rect x="440" y="460" width="26" height="44" rx="10" fill="#b5733d"/><rect x="590" y="460" width="26" height="44" rx="10" fill="#b5733d"/>
  <circle cx="420" cy="390" r="56" fill="#c98a4b"/>
  <ellipse cx="380" cy="410" rx="30" ry="22" fill="#e9c08f"/><circle cx="362" cy="402" r="10" fill="#17162b"/>
  <path d="M440 345 q40 -10 34 60 q-30 -10 -34 -60 Z" fill="#8a5428"/>
  <circle cx="412" cy="380" r="7" fill="#17162b"/>
  <rect x="452" y="420" width="44" height="12" rx="6" fill="#e0413a" transform="rotate(20 474 426)"/>
  <!-- veterinaria -->
  <rect x="740" y="520" width="34" height="150" rx="14" fill="#17162b"/><rect x="786" y="520" width="34" height="150" rx="14" fill="#17162b"/>
  <path d="M722 330 Q780 300 838 330 L850 540 L710 540 Z" fill="#2f8a57"/>
  <path d="M760 330 L780 370 L800 330" stroke="#21704a" stroke-width="8" fill="none"/>
  <path d="M752 336 q-6 80 28 90 q34 -10 28 -90" stroke="#17162b" stroke-width="7" fill="none"/><circle cx="780" cy="430" r="12" fill="#b8bcc6" stroke="#17162b" stroke-width="5"/>
  <circle cx="780" cy="258" r="48" fill="#e9b38f"/>
  <path d="M732 262 Q726 200 782 204 Q836 206 830 262 Q818 228 782 230 Q748 232 732 262 Z" fill="#5b2a6e"/>
  <path d="M830 240 q30 40 6 90" stroke="#5b2a6e" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="762" cy="262" r="5" fill="#17162b"/><circle cx="792" cy="262" r="5" fill="#17162b"/>
  <path d="M768 284 q10 6 20 0" stroke="#17162b" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- brazo acariciando al perro -->
  <g id="brazo"><path d="M736 350 Q680 380 610 405" stroke="#e9b38f" stroke-width="26" fill="none" stroke-linecap="round"/></g>
  <path d="M826 360 Q850 430 800 470" stroke="#e9b38f" stroke-width="26" fill="none" stroke-linecap="round"/>
</svg>
