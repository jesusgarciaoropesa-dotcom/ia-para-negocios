<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Mecánico trabajando en un coche en el taller">
  <!-- pared, portón y suelo -->
  <rect x="0" y="0" width="900" height="690" rx="40" fill="#e9edf2"/>
  <rect x="40" y="60" width="380" height="240" rx="14" fill="#cdd5df"/>
  <path d="M40 120 h380 M40 180 h380 M40 240 h380" stroke="#b6c0cc" stroke-width="10"/>
  <rect x="0" y="660" width="900" height="100" rx="20" fill="#8e98a5"/>
  <path d="M100 700 h140 M330 700 h140" stroke="#ffd43b" stroke-width="10" stroke-dasharray="30 20"/>
  <!-- panel de herramientas -->
  <rect x="470" y="70" width="190" height="150" rx="12" fill="#5b5bd6"/>
  <g stroke="#fff" stroke-width="10" stroke-linecap="round"><path d="M500 100 v60"/><path d="M540 100 v80"/><path d="M580 110 l30 50"/><path d="M630 100 v60"/></g>
  <!-- coche -->
  <path d="M60 520 Q70 440 150 430 L220 370 Q250 350 300 350 L430 350 Q470 352 500 380 L560 430 Q630 440 640 520 Z" fill="#c4452f"/>
  <path d="M235 380 L300 368 L360 368 L360 428 L200 430 Z" fill="#cfe2f7"/><path d="M380 368 L430 368 Q462 372 486 400 L510 428 L380 428 Z" fill="#cfe2f7"/>
  <rect x="60" y="500" width="580" height="30" rx="12" fill="#a63826"/>
  <circle cx="170" cy="540" r="52" fill="#17162b"/><circle cx="170" cy="540" r="22" fill="#b8bcc6"/>
  <circle cx="530" cy="540" r="52" fill="#17162b"/><circle cx="530" cy="540" r="22" fill="#b8bcc6"/>
  <rect x="610" y="470" width="30" height="16" rx="6" fill="#ffd43b"/>
  <!-- banco de trabajo con el móvil -->
  <rect x="120" y="600" width="260" height="18" rx="6" fill="#8a5a34"/>
  <g id="telefono">
    <rect x="360" y="540" width="56" height="90" rx="11" fill="#17162b"/>
    <rect x="366" y="549" width="44" height="70" rx="6" fill="#7b7bf0" id="pantalla"/><path id="check" d="M376 584 l9 9 l16 -20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    <g id="ondas" stroke="#e0413a" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M342 556 q-12 28 0 56"/><path d="M326 546 q-22 38 0 76"/>
      <path d="M434 556 q12 28 0 56"/><path d="M450 546 q22 38 0 76"/>
    </g>
  </g>
  <!-- mecánico con mono -->
  <rect x="740" y="520" width="34" height="150" rx="14" fill="#2c3e66"/><rect x="786" y="520" width="34" height="150" rx="14" fill="#2c3e66"/>
  <path d="M722 330 Q780 300 838 330 L850 560 L710 560 Z" fill="#3a5288"/>
  <rect x="756" y="390" width="48" height="34" rx="8" fill="#2c3e66"/>
  <circle cx="780" cy="258" r="48" fill="#e9b38f"/>
  <path d="M730 250 Q732 200 782 200 Q830 200 832 250 L832 236 Q780 218 730 236 Z" fill="#c4452f"/><rect x="726" y="236" width="110" height="16" rx="8" fill="#a63826"/>
  <circle cx="762" cy="266" r="5" fill="#17162b"/><circle cx="798" cy="266" r="5" fill="#17162b"/>
  <path d="M768 288 q12 6 24 0" stroke="#17162b" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M752 300 q-6 20 10 30" stroke="#5a3a28" stroke-width="5" fill="none" opacity=".35"/>
  <!-- brazo con la llave inglesa -->
  <g id="brazo">
    <path d="M736 350 Q690 372 648 344" stroke="#3a5288" stroke-width="28" fill="none" stroke-linecap="round"/>
    <circle cx="640" cy="340" r="14" fill="#e9b38f"/>
    <rect x="560" y="330" width="80" height="14" rx="6" fill="#b8bcc6" transform="rotate(-20 600 337)"/>
    <path d="M556 330 a16 16 0 1 0 6 -26" stroke="#b8bcc6" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M826 360 Q856 430 812 470" stroke="#3a5288" stroke-width="28" fill="none" stroke-linecap="round"/>
  <circle cx="808" cy="474" r="14" fill="#e9b38f"/>
</svg>
