name: Fotos de las demos
# Cuando el taller sube demos/<slug>/fotos.json a la rama demos, baja esas fotos libres
# (Unsplash/Pexels) a demos/<slug>/img/ y las sube a la misma rama.
on:
  push:
    branches: [demos]
    paths: ["demos/*/fotos.json"]
  workflow_dispatch:
    inputs:
      slugs: {description: "Slugs separados por espacios", required: true}
permissions:
  contents: write
concurrency:
  group: fotos-demos
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demos, fetch-depth: 2}
      - run: pip install --quiet pillow
      - name: Qué demos han cambiado
        id: s
        run: |
          if [ -n "${{ github.event.inputs.slugs }}" ]; then echo "slugs=${{ github.event.inputs.slugs }}" >> $GITHUB_OUTPUT;
          else echo "slugs=$(git diff --name-only HEAD~1 HEAD -- 'demos/*/fotos.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')" >> $GITHUB_OUTPUT; fi
      - run: python3 taller/fotos/traer_fotos.py ${{ steps.s.outputs.slugs }}
      - name: Subir las fotos
        run: |
          git config user.name "fotos-demos"; git config user.email "actions@users.noreply.github.com"
          git add demos/*/img
          git diff --cached --quiet && exit 0
          git commit -m "Fotos de demos: ${{ steps.s.outputs.slugs }}"
          for i in 1 2 3 4 5; do git pull --rebase -q origin demos && git push -q origin HEAD:demos && exit 0; sleep 5; done; exit 1
