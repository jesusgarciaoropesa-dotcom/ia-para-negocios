<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Camarero sirviendo en la barra de un bar">
  <!-- pared, azulejos y suelo -->
  <rect x="0" y="0" width="900" height="690" rx="40" fill="#fbf1e4"/>
  <g fill="#f1dcc0"><rect x="40" y="60" width="90" height="60" rx="8"/><rect x="150" y="60" width="90" height="60" rx="8"/><rect x="260" y="60" width="90" height="60" rx="8"/><rect x="95" y="135" width="90" height="60" rx="8"/><rect x="205" y="135" width="90" height="60" rx="8"/></g>
  <rect x="0" y="660" width="900" height="100" rx="20" fill="#d9c7ae"/>
  <!-- pizarra del menú -->
  <rect x="420" y="70" width="220" height="150" rx="14" fill="#2c3a33" stroke="#8a5a34" stroke-width="12"/>
  <path d="M450 110 h120 M450 140 h150 M450 170 h100" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".85"/>
  <!-- estantería con botellas -->
  <rect x="40" y="250" width="330" height="14" rx="6" fill="#8a5a34"/>
  <rect x="60" y="190" width="26" height="60" rx="8" fill="#2f8a57"/><rect x="66" y="176" width="14" height="16" rx="4" fill="#17162b"/>
  <rect x="104" y="200" width="26" height="50" rx="8" fill="#c4452f"/><rect x="148" y="186" width="26" height="64" rx="8" fill="#e6a23c"/>
  <rect x="192" y="196" width="26" height="54" rx="8" fill="#5b5bd6"/><rect x="236" y="190" width="26" height="60" rx="8" fill="#2f8a57"/>
  <!-- cafetera -->
  <rect x="90" y="330" width="170" height="130" rx="18" fill="#b8bcc6"/><rect x="110" y="350" width="130" height="40" rx="10" fill="#17162b"/>
  <rect x="130" y="400" width="16" height="30" rx="4" fill="#17162b"/><rect x="200" y="400" width="16" height="30" rx="4" fill="#17162b"/>
  <!-- barra -->
  <rect x="20" y="460" width="640" height="40" rx="12" fill="#8a5a34"/>
  <rect x="40" y="500" width="600" height="160" rx="10" fill="#a8703f"/>
  <path d="M120 520 v120 M260 520 v120 M400 520 v120 M540 520 v120" stroke="#8a5a34" stroke-width="10"/>
  <!-- cañas y tapa en la barra -->
  <rect x="300" y="400" width="34" height="60" rx="6" fill="#ffd43b"/><rect x="300" y="396" width="34" height="14" rx="6" fill="#fff"/>
  <ellipse cx="400" cy="456" rx="40" ry="8" fill="#fff"/><path d="M372 450 q28 -26 56 0" fill="#e6a23c"/>
  <!-- móvil en la barra -->
  <g id="telefono">
    <rect x="470" y="360" width="62" height="100" rx="12" fill="#17162b"/>
    <rect x="476" y="370" width="50" height="78" rx="7" fill="#7b7bf0" id="pantalla"/><path id="check" d="M488 410 l10 10 l18 -22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    <g id="ondas" stroke="#e0413a" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M450 380 q-14 30 0 60"/><path d="M432 368 q-24 42 0 84"/>
      <path d="M552 380 q14 30 0 60"/><path d="M570 368 q24 42 0 84"/>
    </g>
  </g>
  <!-- camarero -->
  <rect x="740" y="520" width="34" height="150" rx="14" fill="#17162b"/><rect x="786" y="520" width="34" height="150" rx="14" fill="#17162b"/>
  <path d="M722 330 Q780 300 838 330 L850 540 L710 540 Z" fill="#ffffff"/>
  <path d="M728 420 L832 420 L846 600 L714 600 Z" fill="#17162b"/>
  <path d="M770 330 l10 26 l10 -26" fill="#c4452f"/>
  <circle cx="780" cy="258" r="48" fill="#d9a07a"/>
  <path d="M734 252 Q736 206 782 206 Q828 206 828 252 Q812 228 782 228 Q752 228 734 252 Z" fill="#2b1d14"/>
  <circle cx="762" cy="262" r="5" fill="#17162b"/><circle cx="798" cy="262" r="5" fill="#17162b"/>
  <path d="M762 288 q18 8 36 0" stroke="#2b1d14" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- brazo con la bandeja -->
  <g id="brazo">
    <path d="M736 350 Q690 380 650 350" stroke="#d9a07a" stroke-width="26" fill="none" stroke-linecap="round"/>
    <ellipse cx="630" cy="338" rx="70" ry="12" fill="#b8bcc6"/>
    <rect x="596" y="296" width="24" height="40" rx="5" fill="#ffd43b"/><rect x="596" y="292" width="24" height="10" rx="4" fill="#fff"/>
    <rect x="636" y="304" width="30" height="32" rx="6" fill="#8a5a34"/>
  </g>
  <path d="M826 360 Q856 430 812 470" stroke="#d9a07a" stroke-width="26" fill="none" stroke-linecap="round"/>
</svg>
